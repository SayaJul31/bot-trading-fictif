name: bot-quotidien
on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: hf
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: |
          python bot.py || true
          python bot_momentum.py || true
          python bot_narratifs.py || true
          python bot_copy.py || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state*.json
          git commit -m "maj quotidienne" || true
          git pull --rebase || true
          git push || (git pull --rebase && git push)
